name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-backend-validation:
    name: Backend Code Analysis & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/ ai_backend/ vision_perception/ custom_navigation/ --ignore=E501,F401 || true

  flutter-validation:
    name: Flutter Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'

      - name: Verify or Skip Flutter Check
        run: |
          if [ -f "surviellance_app/pubspec.yaml" ]; then
            cd surviellance_app
            flutter pub get
            flutter analyze --no-fatal-infos
          else
            echo "surviellance_app/pubspec.yaml not present yet. Skipping Flutter analysis."
          fi